<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gallery — Meridian Glass Studio</title>
  <meta name="description" content="Stained, fused, cast and crystal glass works by Meridian Glass Studio.">
  <meta name="theme-color" content="#f2f1ec">
  <meta property="og:title" content="Gallery — Meridian Glass Studio">
  <meta property="og:image" content="/assets/img/glass/dome.webp">
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=boska@400,500,700,400i,500i&amp;f[]=switzer@300,400,500,600&amp;display=swap">
  <link rel="stylesheet" href="/assets/css/site.css">
  <script defer src="/assets/js/site-config.js"></script>
  <script defer src="/assets/js/layout.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/motion@12.23.24/dist/motion.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script defer src="/assets/js/motion-site.js"></script>
</head>
<body data-division="glass">
<main id="main">
  <div class="prism-beam" aria-hidden="true" style="position:fixed"></div>
  <header class="page-hero wrap">
    <p class="eyebrow">Meridian Glass Studio · Gallery</p>
    <h1 style="margin-top:1.5rem" data-split>Works in <em class="prism-text">light.</em></h1>
    <p class="lede" style="color:var(--muted)" data-reveal>Commissions, restorations and installations. Photographs are placeholders for this demo.</p>
  </header>

  <section class="wrap section" style="padding-top:0">
    <div class="gallery" data-stagger>
      <figure class="glass-card"><div class="media" style="aspect-ratio:4/3"><img src="/assets/img/glass/dome.webp" alt="A stained-glass dome" loading="lazy"></div><figcaption><span>Club dome</span><span>Stained glass · 2023</span></figcaption></figure>
      <figure class="glass-card"><div class="media" style="aspect-ratio:3/4"><img src="/assets/img/glass/arches.webp" alt="Arched stained-glass windows" loading="lazy"></div><figcaption><span>Chapel windows</span><span>Leaded · 2022</span></figcaption></figure>
      <figure class="glass-card"><div class="media" style="aspect-ratio:4/3"><img src="/assets/img/glass/sculpture-dark.webp" alt="A blown-glass sculpture on a dark plinth" loading="lazy"></div><figcaption><span>Lobby sculpture</span><span>Blown glass · 2024</span></figcaption></figure>
      <figure class="glass-card"><div class="media" style="aspect-ratio:1"><img src="/assets/img/glass/crystal-burst.webp" alt="Crystal spheres lit from within" loading="lazy"></div><figcaption><span>Atrium burst</span><span>Crystal · 2023</span></figcaption></figure>
      <figure class="glass-card"><div class="media" style="aspect-ratio:4/3"><img src="/assets/img/glass/ceiling-blooms.webp" alt="A ceiling of glass blooms" loading="lazy"></div><figcaption><span>Bloom ceiling</span><span>Blown glass · 2021</span></figcaption></figure>
      <figure class="glass-card"><div class="media" style="aspect-ratio:4/5"><img src="/assets/img/glass/amber-hand.webp" alt="A monumental amber glass hand" loading="lazy"></div><figcaption><span>Public work</span><span>Cast glass · 2022</span></figcaption></figure>
      <figure class="glass-card"><div class="media" style="aspect-ratio:4/3"><img src="/assets/img/glass/spiral.webp" alt="A spiral stained-glass ceiling" loading="lazy"></div><figcaption><span>Spiral skylight</span><span>Stained glass · 2020</span></figcaption></figure>
      <figure class="glass-card"><div class="media" style="aspect-ratio:4/3"><img src="/assets/img/glass/abstract.webp" alt="An abstract stained-glass panel" loading="lazy"></div><figcaption><span>Residence screen</span><span>Fused glass · 2024</span></figcaption></figure>
      <figure class="glass-card"><div class="media" style="aspect-ratio:4/3"><img src="/assets/img/glass/cathedral.webp" alt="A colourful rose window" loading="lazy"></div><figcaption><span>Rose window</span><span>Restoration · 2019</span></figcaption></figure>
      <figure class="glass-card"><div class="media" style="aspect-ratio:3/4"><img src="/assets/img/glass/chandelier-below.webp" alt="A chandelier seen from below" loading="lazy"></div><figcaption><span>Foyer chandelier</span><span>Crystal · 2023</span></figcaption></figure>
      <figure class="glass-card"><div class="media" style="aspect-ratio:4/3"><img src="/assets/img/glass/shards.webp" alt="Close-up of crushed glass" loading="lazy"></div><figcaption><span>Material study</span><span>Cullet</span></figcaption></figure>
      <figure class="glass-card"><div class="media" style="aspect-ratio:4/3"><img src="/assets/img/glass/gallery.webp" alt="A bright gallery of glass pieces on plinths" loading="lazy"></div><figcaption><span>Studio showroom</span><span>Mumbai</span></figcaption></figure>
    </div>
  </section>

  <section class="section cta">
    <div class="wrap grid-12" style="align-items:end">
      <div style="grid-column: 1 / span 8"><p class="eyebrow">Commission a piece</p><h2 style="margin-top:1.5rem" data-split>Something made <em>only for you.</em></h2></div>
      <div style="grid-column: 9 / -1" data-reveal><a class="btn" href="/contact.html?division=glass" data-magnetic>Start a commission <span aria-hidden="true">→</span></a></div>
    </div>
  </section>
</main>
</body>
</html>
